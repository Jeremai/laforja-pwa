<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Forja</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5F9;--sf:#fff;--ln:#D3E2EA;--tx:#0C2230;--mu:#55707F;--ac:#007BA7;--on:#fff;--ok:#1B8A5A;--tn:#EADFC8;--ms:#CC7561;--mo:#E3A08D;--ml:#A35546;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A151E;--sf:#12222F;--ln:#1F3646;--tx:#E8F1F6;--mu:#8BA3B3;--ac:#1FA3D6;--on:#04202C;--ok:#3DD68C;--tn:#6B5B49;--ms:#8E463B;--mo:#B8604F;--ml:#5E2B24}}
:root[data-theme="dark"]{--bg:#0A151E;--sf:#12222F;--ln:#1F3646;--tx:#E8F1F6;--mu:#8BA3B3;--ac:#1FA3D6;--on:#04202C;--ok:#3DD68C;--tn:#6B5B49;--ms:#8E463B;--mo:#B8604F;--ml:#5E2B24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "DM Sans",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 150px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:34px;line-height:1.05}h2{font-size:22px;margin:24px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font:700 24px "Barlow Condensed",sans-serif;margin-bottom:18px}
.brand svg{width:28px;height:28px;fill:var(--ac)}
.mu{color:var(--mu)}.sm{font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--ac);color:var(--on);border-radius:18px;padding:20px;margin-bottom:14px}
.hero .big{font-size:48px;line-height:1}
.hero p{margin:6px 0 0;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:700 16px "DM Sans",sans-serif;background:var(--ac);color:var(--on);cursor:pointer;margin-top:12px}
.hero .btn{background:var(--on);color:var(--ac)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.sm2{width:auto;display:inline-block;padding:8px 12px;margin:0;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:9px 14px;font:500 15px "DM Sans",sans-serif;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.lab{font-weight:700;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex{padding:9px 0;border-top:1px solid var(--ln)}.ex:first-child{border-top:0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.set input{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:500 16px "DM Sans",sans-serif;text-align:center}
.ck{height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);font-size:18px;cursor:pointer}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stat b{display:block;font:700 28px "Barlow Condensed",sans-serif;color:var(--ac)}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--on);opacity:.9}
svg.ch rect{fill:var(--ac)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;background:none;color:var(--mu);padding:14px 0;font:700 14px "DM Sans",sans-serif;cursor:pointer}
#tabs button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px) + 8px);max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:8px}
#rest b{font:700 26px "Barlow Condensed",sans-serif}
#rest button{border:0;border-radius:8px;padding:8px 10px;font:700 13px "DM Sans",sans-serif;background:var(--ac);color:var(--on);cursor:pointer}
.empty{text-align:center;padding:24px 12px;color:var(--mu)}
.in{width:100%;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:11px;font:500 16px "DM Sans",sans-serif;margin:6px 0}
.fb{display:flex;gap:6px;margin-top:10px}.fb button{flex:1;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px;font:500 14px "DM Sans",sans-serif;cursor:pointer}.fb button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:13px}.up{background:var(--ok);color:#fff}.kp{background:var(--ln);color:var(--tx)}.dn{background:#C2410C;color:#fff}
.media img,.media video{width:100%;border-radius:12px;margin:10px 0;max-height:320px;object-fit:cover}a{color:var(--ac);font-weight:700}
#tabs button{font-size:13px}
.pt{background:var(--ac);color:var(--on)}.lb{font:600 8px "DM Sans",sans-serif;fill:var(--mu)}
svg .p{fill:var(--ac);animation:pl 1.1s ease-in-out infinite alternate}svg .s{fill:var(--ac);fill-opacity:.55}svg .o{fill:var(--mo);stroke:var(--ml);stroke-width:.5}svg .f{fill:url(#fb);stroke:none;pointer-events:none}svg .h{fill:url(#gh);stroke:none;pointer-events:none}svg .p,svg .s{stroke:var(--ac);stroke-width:.5}svg .p{filter:drop-shadow(0 0 1.5px var(--ac))}
@keyframes pl{from{opacity:.4}to{opacity:1}}@media (prefers-reduced-motion:reduce){svg .p{animation:none}}
.ani{position:relative;margin:10px 0}.ani img{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin:0}.ani img+img{position:absolute;left:0;top:0;height:100%;animation:fl 1.4s steps(1) infinite}@keyframes fl{0%{opacity:1}50%{opacity:0}}
.rc{display:flex;align-items:center;gap:12px}
.ar{font:700 32px/1 "Barlow Condensed",sans-serif;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.ar.up{background:var(--ok);animation:bu 1.1s ease-in-out infinite}.ar.dn{background:#C2410C;animation:bd 1.1s ease-in-out infinite}.ar.kp{background:var(--ln);color:var(--tx);animation:bk 1.6s ease-in-out infinite}
@keyframes bu{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}@keyframes bd{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}@keyframes bk{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.wt{font:700 28px/1.1 "Barlow Condensed",sans-serif}.wt .tag{font:700 13px "DM Sans",sans-serif;vertical-align:middle;margin-left:6px;animation:pop .5s ease both .5s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rb{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:10px}.rb i{display:block;height:100%;border-radius:99px;animation:gr 1s ease both}@keyframes gr{from{width:0}}
.sl{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ar,.wt .tag,.rb i{animation:none!important}.sl{animation:none;stroke-dashoffset:0}}
button[data-a=upl]{display:none}
</style>
<link rel="manifest" href="./manifest.json">
</head>
<body>
<div id="app"></div>
<div id="rest"><span>Descanso</span><b id="rt">0:00</b><span><button data-a="radd">+15 s</button> <button data-a="rskip">Saltar</button></span></div>
<nav id="tabs"></nav>
<script>
window.claude=window.claude||{use:async()=>null};try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const KEY='laforja:v1';
let S=load(),V='hoy',F=null,conf=false,rest=0,E=null,SW=0,ERR='',AIP=false,LQ='',LM='',LE='',DI=0,LV='';norm();function norm(){if(S.v!==2){if((S.logs&&S.logs.length)||(S.mine&&S.mine.length)){try{localStorage.setItem('laforja:backup-v1',JSON.stringify(S))}catch(e){}}try{localStorage.removeItem('laforja:lib')}catch(e){}S.plan=[];S.logs=[];S.mine=[];S.rec={};S.media={};S.draft=null;S.res=null;S.v=2;save()}S.rst=S.rst||{};if(S.profile&&S.profile.rest===90&&!S.v3)S.profile.rest=0;S.v3=1;S.rec=S.rec||{};S.mine=S.mine||[];S.use=S.use||'ia';S.media=S.media||{}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{profile:null,plan:[],logs:[],seed:1,draft:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const EX=[];
const DEF={pecho:'pecho|hombro,tríceps',espalda:'espalda|bíceps,trapecio',pierna:'cuádriceps,glúteos|isquios,core',hombro:'hombro|tríceps,trapecio','bíceps':'bíceps|antebrazo','tríceps':'tríceps|pecho,hombro',core:'core|lumbar'};
let LIB=[];try{LIB=JSON.parse(localStorage.getItem('laforja:lib2')||'[]')}catch(e){}LIB.forEach(e=>EX.push(e));
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MS={abdominals:'core',abductors:'glúteos',adductors:'glúteos',biceps:'bíceps',calves:'gemelos',chest:'pecho',forearms:'antebrazo',glutes:'glúteos',hamstrings:'isquios',lats:'espalda','lower back':'lumbar','middle back':'espalda',neck:'trapecio',quadriceps:'cuádriceps',shoulders:'hombro',traps:'trapecio',triceps:'tríceps'};
const GR={pecho:'pecho',espalda:'espalda',lumbar:'espalda',trapecio:'hombro',hombro:'hombro','bíceps':'bíceps',antebrazo:'bíceps','tríceps':'tríceps',core:'core','cuádriceps':'pierna','glúteos':'pierna',isquios:'pierna',gemelos:'pierna'};
const EQM={'body only':'p',null:'p','foam roll':'p',dumbbell:'m',kettlebells:'m',bands:'m','medicine ball':'m','exercise ball':'m'};
function mapEx(r){
 const pr=[...new Set((r.primaryMuscles||[]).map(x=>MS[x]).filter(Boolean))],sc=[...new Set((r.secondaryMuscles||[]).map(x=>MS[x]).filter(x=>x&&!pr.includes(x)))];
 const cat=String(r.category||'strength'),g=cat=='stretching'?'estiramiento':cat=='cardio'?'cardio':(GR[pr[0]]||'core');
 return[esc(r.name||'Ejercicio'),g,EQM[r.equipment??'null']||'g',(pr.join(',')||'core')+'|'+sc.join(','),(r.instructions||[]).map(esc).join('\n'),(r.images||[]).join('|'),cat,'',r.level||'',0,r.mechanic=='compound'?'c':'i',String(r.equipment||'')];
}
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('laforja',1);q.onupgradeneeded=()=>q.result.createObjectStore('img');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idbPut=async it=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('img','readwrite'),o=t.objectStore('img');it.forEach(([k,v])=>o.put(v,k));t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise(ok=>{const q=d.transaction('img').objectStore('img').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})};
const durl=b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)});
const small=async f=>{try{const b=await createImageBitmap(f),k=Math.min(1,480/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}catch(e){return f}};
async function loadImgs(e){const box=$('#exim');if(!box||!e[5])return;const id=DI;try{const o=[];for(const k of e[5].split('|')){const b=await idbGet(k);o.push(b?await durl(b):'img/'+k)}if(V!='det'||DI!=id)return;box.innerHTML=o.length==2&&!matchMedia('(prefers-reduced-motion:reduce)').matches?`<div class="ani">${o.map((u,i)=>`<img alt="${e[0]}${i?' (posición final)':' (posición inicial)'}" src="${u}">`).join('')}</div><p class="mu sm" style="text-align:center;margin:0">Animación a partir de las dos fotos del ejercicio</p>`:o.length?`<div style="display:grid;grid-template-columns:repeat(${o.length},1fr);gap:8px">${o.map((u,i)=>`<img alt="${e[0]}, posición ${i?'final':'inicial'}" src="${u}">`).join('')}</div>`:'<p class="mu sm">Aún no has cargado las imágenes de este ejercicio.</p>'}catch(_){}}
const impCard=()=>`<h2>Biblioteca de ejercicios</h2><div class="card"><p class="sm mu" style="margin-top:0">Dataset libre free-exercise-db (dominio público, licencia Unlicense). ${EX.length?`Tienes <b>${EX.length}</b> ejercicios.`:'Aún no hay ejercicios cargados.'}</p><button class="btn sec" data-a="impj">1. Cargar exercises.json</button><button class="btn sec" data-a="impg">2. Cargar imágenes (carpeta exercises)</button><button class="btn sec" data-a="trn" data-v="n">3. Traducir nombres al castellano (IA)</button><button class="btn sec" data-a="trn" data-v="i">4. Traducir instrucciones al castellano (IA)</button><p class="sm mu" id="impmsg"></p><input type="file" id="fj" accept=".json,application/json" hidden><input type="file" id="fg" webkitdirectory multiple hidden></div>`;
document.addEventListener('change',async ev=>{
 const t=ev.target,say=x=>{const q=$('#impmsg');if(q)q.textContent=x};
 if(t.id=='fj'&&t.files[0]){
  try{const d=JSON.parse(await t.files[0].text());if(!Array.isArray(d)||!d.length||!d[0].primaryMuscles)throw 0;
   const L=d.filter(r=>r&&r.name).map(mapEx);localStorage.setItem('laforja:lib2',JSON.stringify(L));LIB=L;EX.length=0;L.forEach(e=>EX.push(e));render();say(`Importados ${L.length} ejercicios.`)}
  catch(e){say('No se pudo importar. Usa dist/exercises.json de free-exercise-db (y comprueba que cabe en el almacenamiento del navegador).')}
  t.value='';
 }
 if(t.id=='fg'&&t.files.length){
  const fl0=[...t.files];t.value='';
  try{const want=new Set();EX.forEach(e=>e[5]&&e[5].split('|').forEach(k=>want.add(k)));
   const fl=fl0.map(f=>[(f.webkitRelativePath||f.name).split('/').slice(-2).join('/'),f]).filter(x=>want.has(x[0]));
   if(!fl.length){say('No encuentro imágenes que coincidan. Carga primero el JSON y elige la carpeta exercises del repositorio.');return}
   let n=0;
   for(let i=0;i<fl.length;i+=40){const b=await Promise.all(fl.slice(i,i+40).map(async([k,f])=>[k,await small(f)]));await idbPut(b);n+=b.length;say(`Guardando imágenes… ${n} de ${fl.length}`)}
   say(`Listo: ${n} imágenes guardadas en este navegador.`);
  }catch(e){say('No se pudieron guardar las imágenes (¿poco espacio en el navegador?).')}
 }
});

const brand=`<div class="brand"><img src="${LOGO}" alt="Forja Gym" style="height:56px;width:auto"><span style="font-size:36px;line-height:1;color:var(--ac)">La Forja</span></div>`,brandL=`<div style="text-align:center;margin:4px 0 12px"><img src="${LOGO}" alt="Forja Gym" style="height:130px;width:auto"><div class="big" style="font-size:46px;color:var(--ac);margin-top:4px">La Forja</div></div>`;
function vOnb(){if(!EX.length)return`${brandL}<h1>Carga tu biblioteca</h1><p class="mu">LaForja necesita los ejercicios para crear tu plan. Descarga el dataset libre y cárgalo aquí.</p>${impCard()}`;return`${brandL}<h1>Cuéntanos sobre ti</h1><p class="mu">Con estos datos, LaForja y su IA preparan tu plan con ejercicios, repeticiones, pesos y descansos adaptados a ti. Podrás cambiarlos cuando quieras en Ajustes.</p>${form()}${errp()}<button class="btn" data-a="create">Crear mi plan</button>`}
function vHoy(){
 const P=PL(),d=S.draft,i=S.logs.length%P.length,pl=P[i],w=weekCount(),tot=S.profile.days;
 const list=pl.ex.map(e=>`<div class="ex row"><span>${EX[e.id][0]}<br><span class="mu sm">${EX[e.id][1]}</span></span><b>${e.sets}×${e.reps}</b></div>`).join('');
 return`${brand}${S.ai?`<p class="sm mu" style="margin:0 0 10px">${S.ai}</p>`:''}<div class="hero"><div class="sm">${d?'Sesión en curso':'Toca hoy'}</div><div class="big">${d?d.name:pl.name}</div><p>${pl.ex.length} ejercicios · ${S.profile.dur} min · descanso ${S.profile.rest||(S.profile.goal=='fuerza'?150:90)} s</p><div class="bar"><i style="width:${Math.min(100,w/tot*100)}%"></i></div><p class="sm">${w} de ${tot} sesiones esta semana</p><button class="btn" data-a="start">${d?'Continuar sesión':'Empezar sesión'}</button></div><div class="card">${list}</div><button class="btn sec" data-a="swapday">Saltar a otra sesión del plan</button>`}
function vSes(){
 const d=S.draft;
 return`<div class="row"><h1>${d.name}</h1><button class="btn sec sm2" data-a="back">Salir</button></div><p class="mu sm">Se guarda solo. Marca cada serie al terminarla y arranca el descanso.</p>`+d.ex.map((e,i)=>`<div class="card"><div class="row"><div><b>${EX[e.id][0]}</b><br><span class="mu sm">${EX[e.id][1]}</span></div><button class="btn sec sm2" data-a="swap" data-i="${i}">Cambiar</button></div>${recLine(e.id)}<div class="set mu sm"><span></span><span>kg</span><span>reps</span><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span class="mu">${j+1}</span><input inputmode="decimal" aria-label="kg" data-e="${i}" data-s="${j}" data-k="kg" value="${s.kg}"><input inputmode="numeric" aria-label="repeticiones" data-e="${i}" data-s="${j}" data-k="reps" value="${s.reps}"><button class="ck ${s.done?'on':''}" data-a="ck" data-i="${i}" data-j="${j}" aria-label="Serie hecha">✓</button></div>`).join('')}<div class="fb">${[['facil','Fácil'],['justo','Justo'],['duro','Duro']].map(([v,t])=>`<button class="${(e.fb||'justo')==v?'on':''}" data-a="fb" data-i="${i}" data-v="${v}">${t}</button>`).join('')}</div><div class="sm mu" style="margin-top:12px">Descanso: <b>${restOf(e.id,e.r)} s</b></div><div class="fb" style="flex-wrap:wrap;margin-top:6px">${[0,30,45,60,90,120,150].map(v=>`<button class="${(S.rst[e.id]||0)==v?'on':''}" data-a="rs" data-i="${i}" data-v="${v}">${v?v+' s':'Auto'}</button>`).join('')}</div><button class="btn sec sm2" style="margin-top:10px" data-a="addset" data-i="${i}">Añadir serie</button></div>`).join('')+`<button class="btn" data-a="finish">Terminar sesión</button><button class="btn sec" data-a="discard">Descartar sesión</button>`}
function vProg(){
 const L=S.logs;if(!L.length)return`${brand}<h1>Progreso</h1><div class="empty">Aún no hay sesiones. Termina tu primera y aquí verás volumen y mejores marcas.</div>`;
 const last=L.slice(-10),mx=Math.max(...last.map(vol),1);
 const bars=last.map((l,i)=>{const h=Math.max(4,vol(l)/mx*80),w=300/last.length;return`<rect x="${i*w+4}" y="${90-h}" width="${w-8}" height="${h}" rx="4"/>`}).join('');
 const best={};L.forEach(l=>l.ex.forEach(e=>e.s.forEach(s=>{const m=s[0]*(1+s[1]/30);if(s[0]>0&&(!best[e.id]||m>best[e.id].m))best[e.id]={m,kg:s[0],r:s[1]}})));
 const top=Object.entries(best).sort((a,b)=>b[1].m-a[1].m).slice(0,6);
 return`${brand}<h1>Progreso</h1><div class="stats" style="margin-top:14px"><div class="stat"><b>${L.length}</b><span class="sm mu">sesiones</span></div><div class="stat"><b>${fmt(L.reduce((a,l)=>a+vol(l),0))}</b><span class="sm mu">volumen total</span></div><div class="stat"><b>${weekCount()}</b><span class="sm mu">esta semana</span></div></div><h2>Volumen por sesión</h2><div class="card"><svg class="ch" viewBox="0 0 300 95" width="100%" role="img" aria-label="Volumen de las últimas sesiones">${bars}</svg></div>${evo()}<h2>Mejores marcas</h2><div class="card">${top.map(([id,b])=>`<div class="ex row"><span>${EX[id][0]}</span><b>${b.kg} kg × ${b.r}</b></div>`).join('')||'<span class="mu">Registra pesos para ver tus marcas.</span>'}</div><h2>Historial</h2>${L.slice(-8).reverse().map(l=>`<div class="card row"><span><b>${l.name}</b><br><span class="mu sm">${fd(l.d)} · ${l.min} min</span></span><b>${fmt(vol(l))}</b></div>`).join('')}`}
function vAj(){return`${brand}<h1>Ajustes</h1><p class="mu">Cambia tus datos y LaForja regenera el plan. Tu historial se conserva.</p>${form()}${errp()}<button class="btn" data-a="regen">Guardar y regenerar plan</button><button class="btn sec" data-a="wipe">${conf?'Pulsa otra vez para borrar todo':'Borrar todos los datos'}</button>${impCard()}<p class="mu sm">Tus datos viven solo en este navegador.</p>`}
function render(){
 const s=(!S.profile||!PL().length)?'onb':V;
 $('#app').innerHTML={onb:vOnb,hoy:vHoy,ses:vSes,prog:vProg,aj:vAj,res:vRes,pl:vPl,lib:vLib,pick:vLib,ed:vEd,det:vDet,sw:vSw}[s]();
 $('#tabs').style.display=['onb','ses','ed','pick','sw'].includes(s)?'none':'flex';
 $('#tabs').innerHTML=[['hoy','Hoy'],['pl','Planes'],['lib','Ejercicios'],['prog','Progreso'],['aj','Ajustes']].map(([k,t])=>`<button class="${V==k?'on':''}" data-a="tab" data-v="${k}">${t}</button>`).join('');

const $=s=>document.querySelector(s);
function startRest(id,pr){rest=Date.now()+restOf(id,pr)*1000;$('#rest').style.display='flex'}
setInterval(()=>{if(!rest)return;const r=Math.ceil((rest-Date.now())/1000);if(r<=0){rest=0;$('#rest').style.display='none';try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}return}$('#rt').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')},250);
function newSets(e){const k=recKg(e.id);return Array.from({length:e.sets},()=>({kg:k,reps:up(e.reps),done:false}))}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,d=S.draft;
 if(a=='set'){const v=b.dataset.v;F[b.dataset.f]=isNaN(v)?v:+v;if(b.dataset.f=='where')F.equip=[...WH[F.where]]}
 else if(a=='tog'){const v=b.dataset.v,q=F.equip=F.equip||[],k=q.indexOf(v);k<0?q.push(v):q.splice(k,1)}
 else if(a=='aiplan'){AIP=true}
 else if(a=='create'||a=='regen'){const ag=+F.age,wg=+String(F.weight).replace(',','.');
  if(!(ag>=12&&ag<=90&&wg>=30&&wg<=250)){ERR='Indica tu edad (12-90) y tu peso en kg (30-250).';render();return}
  ERR='';const o=S.profile,q=F.equip||[],same=a=='regen'&&o&&['goal','level','days','dur','where'].every(k=>o[k]==F[k])&&JSON.stringify(o.equip)==JSON.stringify(F.equip);
  S.profile={...F,age:ag,weight:wg,equip:[...q],eq:q.some(k=>['barra','maquinas','poleas'].includes(k))?'g':q.some(k=>['mancuernas','kettlebells','bandas'].includes(k))?'m':'p'};
  if(!same||!S.plan.length){S.plan=genPlan(S.profile);S.draft=null;S.ai='';AIP=true}V='hoy';conf=false}
 else if(a=='tab'){V=b.dataset.v;conf=false}
 else if(a=='start'){if(!d){const i2=S.logs.length%PL().length,pl=PL()[i2];S.draft={name:pl.name,t0:Date.now(),ex:pl.ex.map(e=>({id:e.id,t:e.reps,r:e.rest,sets:newSets(e)}))}}V='ses'}
 else if(a=='swapday'){S.logs.push({d:Date.now(),name:'(saltada) '+PL()[S.logs.length%PL().length].name,min:0,ex:[]});}
 else if(a=='back'){V='hoy'}
 else if(a=='ck'){const s=d.ex[i].sets[j];s.done=!s.done;if(s.done)startRest(d.ex[i].id,d.ex[i].r)}
 else if(a=='addset'){const e=d.ex[i],l=e.sets[e.sets.length-1];e.sets.push({kg:l.kg,reps:l.reps,done:false})}
 else if(a=='swap'){SW=i;V='sw'}
 else if(a=='swback'){V='ses'}
 else if(a=='swpick'){const o=d.ex[SW],n=o.sets.length;d.ex[SW]={id:i,t:o.t,r:o.r,sets:Array.from({length:n},()=>({kg:recKg(i),reps:o.sets[0].reps,done:false}))};V='ses'}
 else if(a=='rs'){const v=+b.dataset.v,id=d.ex[i].id;if(v)S.rst[id]=v;else delete S.rst[id]}
 else if(a=='finish'){
  const ex=d.ex.map(e=>({id:e.id,t:e.t,fb:e.fb||'justo',s:e.sets.filter(s=>s.done).map(s=>[+String(s.kg).replace(',','.')||0,+s.reps||0])})).filter(e=>e.s.length);
  if(!ex.length){alert('Marca al menos una serie como hecha.');return}
  S.logs.push({d:Date.now(),name:d.name,min:Math.max(1,Math.round((Date.now()-d.t0)/60000)),ex});ex.forEach(e=>S.rec[e.id]=engine(e.id,e));S.res=ex.map(e=>e.id);S.draft=null;V='res';rest=0;$('#rest').style.display='none'}
 else if(a=='discard'){S.draft=null;V='hoy';rest=0;$('#rest').style.display='none'}
 else if(a=='fb'){d.ex[i].fb=b.dataset.v}
 else if(a=='ai'){ai();return}
 else if(a=='use'){S.use=b.dataset.v}
 else if(a=='new'){E={name:'',ex:[],i:-1};V='ed'}
 else if(a=='edit'){E={...JSON.parse(JSON.stringify(S.mine[i])),i};V='ed'}
 else if(a=='del'){S.mine.splice(i,1)}
 else if(a=='edcancel'){V='pl'}
 else if(a=='exdel'){E.ex.splice(i,1)}
 else if(a=='pickex'){V='pick'}
 else if(a=='pickback'){V='ed'}
 else if(a=='pickit'){E.ex.push({id:i,sets:3,reps:'8-12'});V='ed'}
 else if(a=='edsave'){if(!E.ex.length){alert('Añade al menos un ejercicio.');return}E.ex.forEach(e=>{if(!/\d/.test(e.reps))e.reps='8-12';e.sets=Math.max(1,+e.sets||3)});const r={name:E.name.trim()||'Mi rutina',ex:E.ex};if(E.i<0)S.mine.push(r);else S.mine[E.i]=r;S.use='mine';V='pl'}
 else if(a=='lm'){LM=b.dataset.v}
 else if(a=='trn'){trn(b.dataset.v);return}
 else if(a=='impj'){$('#fj').click();return}
 else if(a=='impg'){$('#fg').click();return}
 else if(a=='le'){LE=b.dataset.v}
 else if(a=='detail'){DI=i;V='det'}
 else if(a=='upl'){$('#file').click();return}
 else if(a=='radd'){rest+=15000;return}
 else if(a=='rskip'){rest=0;$('#rest').style.display='none';return}
 else if(a=='wipe'){if(!conf){conf=true;render();return}S={profile:null,plan:[],logs:[],seed:1,draft:null};norm();F=dflt();conf=false;V='hoy'}
 save();render();if(AIP){AIP=false;aiPlan()}
});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.pf){F[t.dataset.pf]=t.value;return}
 if(t.id=='q'){LQ=t.value;$('#liblist').innerHTML=libList();return}
 if(t.id=='ename'){E.name=t.value;return}
 if(t.dataset.g){E.ex[+t.dataset.i][t.dataset.g]=t.value;return}if(t.dataset.k&&S.draft){S.draft.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.k]=t.value;save()}});
const libList=()=>{const a=EX.map((e,i)=>({e,i})).filter(o=>(!LM||o.e[1]==LM)&&(!LE||o.e[2]==LE)&&(o.e[0]+' '+(o.e[7]||'')).toLowerCase().includes(LQ.toLowerCase())),h=a.slice(0,120).map(o=>`<div class="card row" data-a="${V=='pick'?'pickit':'detail'}" data-i="${o.i}" style="cursor:pointer"><span style="display:flex;gap:10px;align-items:center">${S.media[o.i]?`<img src="${S.media[o.i].url}" width="44" height="44" style="border-radius:8px;object-fit:cover" alt="" loading="lazy">`:''}<span><b>${o.e[0]}</b><br><span class="mu sm">${rg(o.e)[0].join(', ')} · ${EQN[o.e[2]]}</span></span></span><span aria-hidden="true">›</span></div>`).join('')||'<div class="empty">Sin resultados.</div>';return h+(a.length>120?`<p class="mu sm" style="text-align:center">Mostrando 120 de ${a.length}. Afina la búsqueda.</p>`:'')};
function vLib(){const ms=[...new Set(EX.map(e=>e[1]))];return`${V=='pick'?'<div class="row"><h1>Elegir ejercicio</h1><button class="btn sec sm2" data-a="pickback">Volver</button></div>':brand+'<h1>Ejercicios</h1>'}<input class="in" id="q" placeholder="Buscar ejercicio" value="${LQ.replace(/"/g,'')}"><div class="chips"><button class="chip ${LM?'':'on'}" data-a="lm" data-v="">Todos</button>${ms.map(m=>`<button class="chip ${LM==m?'on':''}" data-a="lm" data-v="${m}">${m}</button>`).join('')}</div><div class="chips">${[['','Todo el equipo'],['g','Gimnasio'],['m','Mancuernas'],['p','Peso corporal']].map(([v,t])=>`<button class="chip ${LE==v?'on':''}" data-a="le" data-v="${v}">${t}</button>`).join('')}</div><div id="liblist">${libList()}</div>`}
function vDet(){const e=EX[DI],u=S.media[DI],k=lastKg(DI);return`<div class="row"><h1>${e[0]}</h1><button class="btn sec sm2" data-a="tab" data-v="lib">Volver</button></div><div class="card" style="margin-top:12px">${figx(e)}</div><p><b>Equipo:</b> ${EQN[e[2]]}</p><p class="mu">Última carga: ${k?k+' kg':'sin registrar'}</p><p><a href="https://www.youtube.com/results?search_query=${encodeURIComponent('cómo hacer '+e[0]+' técnica')}" target="_blank" rel="noopener">Ver vídeos de técnica</a></p><div class="media" id="exim"></div><div class="media">${u?(u.t.startsWith('video')?`<video controls playsinline src="${u.url}"></video>`:`<img alt="${e[0]}" src="${u.url}">`):''}</div><button class="btn sec" data-a="upl">${u?'Cambiar mi vídeo o imagen':'Añadir mi vídeo o imagen'}</button><input type="file" id="file" accept="image/*,video/*" hidden><p class="mu sm" id="upmsg"></p>${e[4]?`<h2>Cómo se hace</h2><ol>${e[4].split('\n').map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${e[5]?'<p class="mu sm">Datos e imágenes: free-exercise-db (dominio público).</p>':''}`}
document.addEventListener('change',async ev=>{if(ev.target.id!='file'||!ev.target.files[0])return;const f=ev.target.files[0],m=$('#upmsg');try{m.textContent='Subiendo…';const as=await claude.use('assets');if(!as){m.textContent='Subir archivos no está disponible aquí.';return}const r=await as.upload(f);S.media[DI]={url:r.url,t:f.type};save();render()}catch(e){m.textContent='No se pudo subir (máx. 20 MB).'}});
function vPl(){const mine=S.use=='mine',L=mine?S.mine:S.plan;return`${brand}<h1>Planes</h1><div class="chips"><button class="chip ${mine?'':'on'}" data-a="use" data-v="ia">Plan de LaForja</button><button class="chip ${mine?'on':''}" data-a="use" data-v="mine">Mis rutinas</button></div><p class="mu sm">${mine?'Hoy usará tus rutinas en orden.':'Plan generado según tu objetivo y tu equipo.'}</p>${L.map((p,i)=>`<div class="card"><div class="row"><b>${p.name}</b>${mine?`<span><button class="btn sec sm2" data-a="edit" data-i="${i}">Editar</button> <button class="btn sec sm2" data-a="del" data-i="${i}">Borrar</button></span>`:''}</div><p class="mu sm" style="margin:6px 0 0">${p.ex.map(e=>EX[e.id][0]).join(', ')}</p></div>`).join('')||'<div class="empty">Aún no tienes rutinas. Crea la primera.</div>'}<button class="btn sec" data-a="aiplan">Readaptar plan con IA</button><button class="btn" data-a="new">Crear rutina propia</button>`}
function vEd(){return`<div class="row"><h1>${E.i<0?'Nueva rutina':'Editar rutina'}</h1><button class="btn sec sm2" data-a="edcancel">Cancelar</button></div><input class="in" id="ename" placeholder="Nombre, por ejemplo Torso lunes" value="${E.name.replace(/"/g,'')}">${E.ex.map((e,i)=>`<div class="card"><div class="row"><b>${EX[e.id][0]}</b><button class="btn sec sm2" data-a="exdel" data-i="${i}">Quitar</button></div><div class="set" style="grid-template-columns:1fr 1fr"><input data-g="sets" data-i="${i}" inputmode="numeric" value="${e.sets}" aria-label="series"><input data-g="reps" data-i="${i}" value="${e.reps}" aria-label="repeticiones, por ejemplo 8-12"></div><span class="mu sm">series · repeticiones</span></div>`).join('')}<button class="btn sec" data-a="pickex">Añadir ejercicio</button><button class="btn" data-a="edsave">Guardar rutina</button>`}
const swCands=i=>{const d=S.draft,E0=EX[d.ex[i].id],av=avail(S.profile.eq),ok=k=>okEq(EX[k])&&EX[k][6]=='strength'&&!d.ex.some(x=>x.id==k),pm=rg(E0)[0][0];let c=EX.map((e,k)=>k).filter(k=>ok(k)&&rg(EX[k])[0][0]==pm);if(c.length<3)c=EX.map((e,k)=>k).filter(k=>ok(k)&&EX[k][1]==E0[1]);return c.sort((a,b)=>(EX[b][10]==E0[10])-(EX[a][10]==E0[10])).slice(0,80)};

function vRes(){const g=S.res||[];return`${brand}<h1>Sesión guardada</h1><p class="mu">Esto es lo que toca la próxima vez, según cómo te fue, tu objetivo y tu nivel.</p>${sumr(g)}${g.map(id=>wcard(id,S.logs[S.logs.length-1])).join('')}<button class="btn" data-a="ai" id="aibtn">Afinar con IA</button><button class="btn sec" data-a="tab" data-v="prog">Ver progreso</button>`}
async function ai(){
 const bt=$('#aibtn');bt.disabled=true;bt.textContent='Analizando…';
 try{
  const sm=await claude.use('sample');if(!sm){bt.textContent='IA no disponible aquí';return}
  const P=S.profile,L=S.logs[S.logs.length-1],data=L.ex.map(e=>({id:e.id,ejercicio:EX[e.id][0],musculo:EX[e.id][1],reps_objetivo:e.t,sensacion:e.fb,series_kg_reps:e.s,motor:S.rec[e.id]}));
  const r=await sm.json(`Eres un entrenador de fuerza. Perfil: objetivo ${P.goal} (musculo, fuerza o definicion), nivel ${P.level} (p, i o a), equipo ${P.eq}, sesión "${L.name}". Datos: ${JSON.stringify(data)}. Para cada ejercicio decide si el peso de la próxima sesión debe subir (add), mantenerse (keep) o bajar (cut). Parte de la sugerencia del motor y corrígela solo con un motivo claro. Responde SOLO con un array JSON: [{"id":número,"act":"add|keep|cut","kg":número,"why":"máximo 15 palabras en español"}]`);
  r.forEach(x=>{const e=L.ex.find(o=>o.id==x.id);if(!e||!['add','keep','cut'].includes(x.act))return;const m=Math.max(...e.s.map(q=>q[0])),k=+x.kg||0;S.rec[x.id]={act:x.act,kg:m?Math.min(Math.max(k,m*.8),m*1.1):0,why:String(x.why||'').slice(0,120)}});
  save();render();
 }catch(e){bt.disabled=false;bt.textContent='No se pudo analizar. Reintentar'}
}
async function trn(kind){
 const say=x=>{const q=$('#impmsg');if(q)q.textContent=x},nm=kind=='n',sz=nm?60:10;
 const todo=EX.map((e,i)=>i).filter(i=>nm?!EX[i][7]:!EX[i][9]&&EX[i][4]);
 if(!todo.length){say('No hay nada pendiente de traducir.');return}
 const un=t=>t.replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
 try{const sm=await claude.use('sample');if(!sm){say('La IA no está disponible aquí.');return}
  let done=0;
  for(let i=0;i<todo.length;i+=sz){
   const ch=todo.slice(i,i+sz),src=ch.map(j=>un(nm?EX[j][0]:EX[j][4]));
   const r=await sm.json(`Traduce al castellano de España estos ${src.length} ${nm?'nombres de ejercicios de gimnasio, con la terminología habitual en los gimnasios españoles (por ejemplo: press banca, remo, dominadas, sentadilla, peso muerto, curl, jalón)':'textos de instrucciones de ejercicios; cada texto tiene varios pasos separados por saltos de línea, conserva esos saltos y el número de pasos'}. Mantén el mismo orden. Responde SOLO con un array JSON de ${src.length} cadenas. Textos: ${JSON.stringify(src)}`);
   if(!Array.isArray(r)||r.length!=ch.length)throw new Error('formato');
   ch.forEach((j,n)=>{const e=EX[j],v=esc(String(r[n]).trim());if(nm){e[7]=e[0];if(v)e[0]=v}else{e[9]=1;if(v)e[4]=v}});
   done+=ch.length;try{localStorage.setItem('laforja:lib2',JSON.stringify(LIB))}catch(_){}
   say(`Traducidos ${done} de ${todo.length}…`);
  }
  render();say('Listo.');
 }catch(err){render();say('La traducción se detuvo (límite o formato). Vuelve a pulsar para continuar donde se quedó.')}
}
F=S.profile?{...dflt(),...S.profile,equip:[...(S.profile.equip||WH.gym)]}:dflt();
if(S.draft&&S.profile)V='ses';
render();
async function bootLib(){if(EX.length)return;try{const r=await fetch('data/exercises.json');if(!r.ok)throw 0;const d=await r.json(),L=d.filter(x=>x&&x.name).map(mapEx);try{localStorage.setItem('laforja:lib2',JSON.stringify(L))}catch(_){}LIB=L;L.forEach(e=>EX.push(e));render()}catch(e){}}
